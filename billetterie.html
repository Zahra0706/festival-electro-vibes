<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billetterie - Atlas Pulse Festival 2027</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #101426;
            color: white;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: #1e2540;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
            color: #00e5ff;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: none;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: #00e5ff;
            color: #101426;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #00b8cc;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Atlas Pulse Festival 2027</h1>
        <h2>Réservation de billets</h2>

        <form id="reservationForm">

            <label for="nom">Nom complet :</label>
            <input type="text" id="nom"
                   placeholder="Votre nom complet" required>

            <label for="email">Adresse email :</label>
            <input type="email" id="email"
                   placeholder="exemple@email.com" required>

            <label for="telephone">Téléphone :</label>
            <input type="tel" id="telephone"
                   placeholder="Votre numéro de téléphone" required>

            <label for="billet">Type de billet :</label>
            <select id="billet" required>
                <option value="">Choisir un billet</option>
                <option value="standard">Standard - 150 DH</option>
                <option value="vip">VIP - 350 DH</option>
                <option value="premium">Premium - 500 DH</option>
            </select>

            <label for="quantite">Nombre de billets :</label>
            <input type="number" id="quantite"
                   min="1" max="10" value="1" required>

            <button type="submit">Réserver maintenant</button>

        </form>

        <p id="message" role="status"></p>
    </div>

    <script>
        document.getElementById("reservationForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const nom = document.getElementById("nom").value;
                const billet = document.getElementById("billet").value;
                const quantite = document.getElementById("quantite").value;

                document.getElementById("message").textContent =
                    "Merci " + nom +
                    " ! Votre demande de " + quantite +
                    " billet(s) " + billet +
                    " a été enregistrée pour cette démonstration.";
            });
    </script>

</body>
</html>
